name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows x64
            os: windows-latest
            rust_targets: ''
            args: --bundles nsis,msi
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find "${{ matrix.bundle_dir }}" \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} dist/ \;
          # Spaces in file names become dots on GitHub; use dashes instead
          for f in dist/*; do mv "$f" "$(echo "$f" | tr ' ' '-')"; done
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > src-tauri/gen/android/keystore.properties
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Android signing secrets are not set; see README"
            exit 1
          else
            echo "::warning::Android signing secrets are not set; the APK will be unsigned"
          fi

      - name: Build
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 armv7 i686 x86_64

      - name: Collect APK
        run: |
          mkdir -p dist
          version=$(node -p "require('./package.json').version")
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          suffix=$([[ "$apk" == *unsigned* ]] && echo "-unsigned" || echo "")
          cp "$apk" "dist/Neo-Foliate_${version}_android-universal${suffix}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: installers-android
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: Neo Foliate ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            - **macOS** (Apple Silicon and Intel): `Neo-Foliate_*_universal.dmg`
            - **Windows**: `Neo-Foliate_*_x64-setup.exe` (installer) or `.msi`
            - **Android** 8.0+ (phones, tablets, all CPU types): `Neo-Foliate_*_android-universal.apk`

            The builds are not signed with Apple or Microsoft certificates yet.
            On macOS, right-click the app and choose *Open* the first time
            (or run `xattr -dr com.apple.quarantine "/Applications/Neo Foliate.app"`).
            On Windows, choose *More info → Run anyway* if SmartScreen appears.
            On Android, allow installing apps from your browser or file manager when asked.
